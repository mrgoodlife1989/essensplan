<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Essensplan</title>
<meta name="theme-color" content="#08090a">
<meta name="color-scheme" content="dark">
<meta name="description" content="Wochenplan, Rezepte und gemeinsame Einkaufsliste für 2 Personen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Essensplan">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <p class="brand">Wochenkarte · für zwei</p>
  <label class="week-select">
    <span id="weekLabel">…</span>
    <select id="weekSelect" aria-label="Woche wählen"></select>
  </label>
</header>

<div id="syncBanner" class="banner" hidden>Nur auf diesem Gerät gespeichert · Sync folgt</div>

<main>
  <section id="view-plan" class="view">
    <div class="week-nav">
      <button class="link" id="prevWeek" aria-label="Vorherige Woche"><span class="arr">←</span> Vorwoche</button>
      <button class="link" id="nextWeek" aria-label="Nächste Woche">Nächste Woche <span class="arr">→</span></button>
    </div>
    <details class="week-info" id="weekInfo">
      <summary><span>Über diese Woche</span><span class="arr">↓</span></summary>
      <p id="weekIntro"></p>
      <p class="prep-note" id="weekPrep"></p>
    </details>
    <nav class="days" id="dayChips" aria-label="Wochentage"></nav>
    <div id="dayContent"></div>
  </section>

  <section id="view-shop" class="view" hidden>
    <header class="page-head">
      <p class="kicker">Einkauf</p>
      <h2 class="page-title">Die Liste der Woche.</h2>
    </header>
    <div class="shop-head">
      <div class="progress"><div class="bar"><span id="progBar"></span></div><span id="progText">0/0</span></div>
      <div class="shop-actions">
        <button class="link" id="toggleDone">Erledigte ausblenden</button>
        <button class="link danger" id="resetAll">Alle zurücksetzen</button>
        <button class="link" id="copyBring">Für Bring! kopieren <span class="arr">→</span></button>
      </div>
      <form class="add-item" id="addForm">
        <input id="addInput" type="text" placeholder="Artikel hinzufügen" autocomplete="off" enterkeyhint="done">
        <button type="submit" class="link" aria-label="Hinzufügen">Hinzufügen <span class="arr">→</span></button>
      </form>
    </div>
    <div id="shopList"></div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="plan" class="active">Menü</button>
  <button data-tab="shop">Einkauf</button>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<article class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></article>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
