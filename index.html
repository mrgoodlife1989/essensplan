<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Essensplan</title>
<meta name="theme-color" content="#0f0e0c">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<meta name="description" content="Wochenplan, Rezepte und gemeinsame Einkaufsliste für 2 Personen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Essensplan">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <p class="brand">Wochenkarte · für zwei</p>
  <div class="week-switch">
    <button class="nav" id="prevWeek" aria-label="Vorherige Woche">‹</button>
    <label class="week-select">
      <span id="weekLabel">…</span>
      <select id="weekSelect" aria-label="Woche wählen"></select>
    </label>
    <button class="nav" id="nextWeek" aria-label="Nächste Woche">›</button>
  </div>
</header>

<div id="syncBanner" class="banner" hidden>Nur auf diesem Gerät gespeichert · Sync folgt</div>

<main>
  <section id="view-plan" class="view">
    <details class="week-info" id="weekInfo">
      <summary>Zur Woche</summary>
      <p id="weekIntro"></p>
      <p class="prep-note" id="weekPrep"></p>
    </details>
    <nav class="days" id="dayChips" aria-label="Wochentage"></nav>
    <div id="dayContent"></div>
  </section>

  <section id="view-shop" class="view" hidden>
    <div class="shop-head">
      <div class="progress"><div class="bar"><span id="progBar"></span></div><span id="progText">0/0</span></div>
      <div class="shop-actions">
        <button class="chip-btn" id="toggleDone">Erledigte ausblenden</button>
        <button class="chip-btn" id="copyBring">Für Bring! kopieren</button>
        <button class="chip-btn danger" id="resetAll">Alle zurücksetzen</button>
      </div>
      <form class="add-item" id="addForm">
        <input id="addInput" type="text" placeholder="Artikel hinzufügen …" autocomplete="off" enterkeyhint="done">
        <button type="submit" aria-label="Hinzufügen">+</button>
      </form>
    </div>
    <div id="shopList"></div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="plan" class="active"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="6.5"/><path d="M3 4v6M5 4v6M3 10c0 1.2.9 2 2 2M4 12v8M20 4c-1.5 1-2 3-2 6h2v10"/></svg>Menü</button>
  <button data-tab="shop"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Einkauf</button>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<article class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></article>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
